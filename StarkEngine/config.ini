# STARK ENGINE v4.0 Configuration File

[Display]
resolution_width = 1920
resolution_height = 1080
fullscreen = true
target_fps = 60

[Performance]
# Process vision every N frames (higher = faster but less responsive)
vision_process_interval = 2
# Mesh quality: low, medium, high, ultra
default_quality = high
# Maximum vertices for performance limit
max_vertices = 10000
# Enable frame rate limiter
fps_limiter = true

[Vision]
# Camera index (0 for default webcam)
camera_index = 0
# Camera resolution
camera_width = 1280
camera_height = 720
# MediaPipe model complexity (0=lite, 1=full)
model_complexity = 0
# Detection confidence threshold
min_detection_confidence = 0.7
# Tracking confidence threshold  
min_tracking_confidence = 0.7
# Maximum hands to detect
max_hands = 2
# Pinch detection threshold
pinch_threshold = 0.05

[Physics]
# Rotation speed multiplier
rotation_speed = 0.005
# Momentum transfer ratio
momentum_ratio = 0.1
# Friction coefficient (0-1, higher = more friction)
friction = 0.98

[Camera]
# Initial zoom level
initial_zoom = 1.0
# Min/Max zoom limits
min_zoom = 0.1
max_zoom = 5.0
# Perspective focal length
focal_length = 800
# Z-axis offset
z_offset = 600

[Grid]
# Grid line color (R, G, B, A)
grid_color = 255, 255, 255, 30
# Base grid spacing
grid_spacing = 100
# Min/Max spacing limits
min_grid_spacing = 20
max_grid_spacing = 200

[UI]
# Show FPS counter by default
show_fps = true
# UI colors
ui_primary = 0, 255, 255
ui_secondary = 255, 0, 255
# Background tint opacity (0-255)
bg_tint_alpha = 220

[Smoothing]
# Hand tracking smoothing (higher = smoother but more lag)
smoothing_alpha_base = 0.2
smoothing_alpha_max = 0.8
# Distance threshold for fast movement detection
fast_movement_threshold = 100.0

[Advanced]
# Enable depth sorting for realistic rendering
depth_sorting = true
# Enable mesh caching
mesh_caching = true
# Enable antialiasing
antialiasing = true
# Frame buffer size (lower = less latency, higher = more stable)
frame_buffer_size = 1
